name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: worker/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run typecheck:dashboard
      - run: pnpm run typecheck:preview
      - run: pnpm test
      # The preview bundles src/ for the browser: this catches an import in src/ its build can't resolve.
      - run: pnpm run build:preview

  selfhost:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun test selfhost
      # The image builds, starts and serves: the dashboard sends a visitor to sign in.
      - run: docker build --build-arg COMMIT=${{ github.sha }} -t shelf .
      - run: |
          docker run -d --name shelf -p 8080:8080 -e SHELF_PASSWORD=ci-password-only shelf
          for _ in $(seq 30); do curl -sf localhost:8080/llms.txt > /dev/null && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -H 'accept: text/html' localhost:8080/dashboard)" = "303 http://localhost:8080/login?next=%2Fdashboard"
          test "$(curl -s -o /dev/null -w '%{http_code}' -d password=ci-password-only localhost:8080/login)" = 303
      - if: failure()
        run: docker logs shelf

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - run: go vet ./...
      - run: go test ./...
