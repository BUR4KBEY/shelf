name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: worker/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.13.1
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run typecheck:dashboard
      - run: pnpm run typecheck:preview
      - run: pnpm test
      # The preview bundles src/ for the browser: this catches an import in src/ its build can't resolve.
      - run: pnpm run build:preview

  selfhost:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun test selfhost
      # The image builds, starts and serves: the dashboard sends a visitor to sign in, and a session outlives a restart.
      - run: docker build --build-arg COMMIT=${{ github.sha }} -t shelf .
      - run: |
          up() { for _ in $(seq 30); do curl -sf localhost:8080/llms.txt > /dev/null && return; sleep 1; done; return 1; }
          docker run -d --name shelf -p 8080:8080 -v shelf-data:/data -e SHELF_PASSWORD=ci-password-only shelf
          up
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -H 'accept: text/html' localhost:8080/dashboard)" = "303 http://localhost:8080/login?next=%2Fdashboard"
          test "$(curl -s -c jar -o /dev/null -w '%{http_code}' -d password=ci-password-only localhost:8080/login)" = 303
          test "$(curl -s -b jar -o /dev/null -w '%{http_code}' localhost:8080/dashboard/api/docs)" = 200
          docker restart shelf
          up
          test "$(curl -s -b jar -o /dev/null -w '%{http_code}' localhost:8080/dashboard/api/docs)" = 200
          test "$(docker exec shelf stat -c %a /data/session.key)" = 600
      - if: failure()
        run: docker logs shelf

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Exact: go.mod's `go 1.27` would let setup-go pick the newest 1.27.x.
          go-version: 1.27.3
      - run: go vet ./...
      - run: go test ./...
