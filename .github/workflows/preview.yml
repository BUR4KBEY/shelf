name: preview
on:
  # Branches in this repo deploy on their own. Fork PRs get no secrets here and are skipped.
  pull_request:
    types: [opened, synchronize, reopened]
  # Fork PRs deploy only when you run this by hand, after reviewing the commit.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        type: number
        required: true
      sha:
        description: Full SHA of the commit you reviewed; exactly this commit is deployed
        type: string
        required: true
  # Runs the base branch's workflow with secrets so fork previews get deleted too. Never checks out PR code.
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: preview-${{ github.event.pull_request.number || inputs.pr }}

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PR: ${{ github.event.pull_request.number || inputs.pr }}
  PREVIEW: pr-${{ github.event.pull_request.number || inputs.pr }}
  GH_REPO: ${{ github.repository }}

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    outputs:
      url: ${{ steps.preview.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty on pull_request, which checks out the PR as before.
          ref: ${{ inputs.sha }}
          # PR code runs with the Cloudflare token; don't hand it a GitHub one in .git/config too.
          persist-credentials: false
      # Before any PR code runs, so the GitHub token stays out of its reach.
      - id: pr
        run: echo "title=$(gh pr view "$PR" --json title --jq .title)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      # Every preview shares the shelf-preview database, so this PR's migrations land there for all previews.
      - run: npx wrangler d1 migrations apply DB --remote --config wrangler.preview-migrations.jsonc
      - id: preview
        # The custom build's log goes to stdout ahead of the JSON, so skip to the first line that opens it.
        run: |
          npx wrangler preview --name "$PREVIEW" --message "$TITLE" --json > preview.json
          url=$(sed -n '/^{/,$p' preview.json | jq -er '.preview.urls[0]')
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          TITLE: ${{ steps.pr.outputs.title }}

  # A separate job: PR code ran with sudo on the deploy runner, so that runner never gets a write token.
  comment:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - run: gh pr comment "$PR" --edit-last --create-if-none --body "Preview $URL (dashboard at $URL/dashboard)"
        env:
          URL: ${{ needs.deploy.outputs.url }}
          GH_TOKEN: ${{ github.token }}

  cleanup:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      # The base branch, not the PR: this job has secrets for every PR, forks included.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      # Only PRs that got a preview have the bot's comment; skip the rest.
      - run: |
          n=$(gh pr view "$PR" --json comments --jq '[.comments[] | select((.author.login | startswith("github-actions")) and (.body | startswith("Preview ")))] | length')
          [ "$n" -gt 0 ] || { echo "PR #$PR has no preview"; exit 0; }
          npm ci
          npx wrangler preview delete --name "$PREVIEW" --skip-confirmation
        env:
          GH_TOKEN: ${{ github.token }}
