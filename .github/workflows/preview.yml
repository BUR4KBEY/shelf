name: preview
on:
  # Branches in this repo deploy on their own. Fork PRs get no secrets here and are skipped.
  pull_request:
    types: [opened, synchronize, reopened]
  # Fork PRs deploy only after you review them: the owner comments `/deploy-preview <sha>` on the PR, or runs this by hand.
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        type: number
        required: true
      sha:
        description: The full 40-character id of the commit you reviewed; it must still be the PR's head
        type: string
        required: true
  # Runs the base branch's workflow with secrets so fork previews get deleted too. Never checks out PR code.
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: read

# The Cloudflare token goes only to the jobs that call wrangler (deploy, cleanup), never to target or report.
env:
  GH_REPO: ${{ github.repository }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  # Picks the PR and the exact commit to deploy, and marks the `preview` status pending. Runs no PR code.
  target:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.author_association == 'OWNER' && startsWith(github.event.comment.body, '/deploy-preview'))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      statuses: write
    outputs:
      pr: ${{ steps.target.outputs.pr }}
      sha: ${{ steps.target.outputs.sha }}
      title: ${{ steps.target.outputs.title }}
    steps:
      - id: target
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr || github.event.issue.number }}
          SHA: ${{ github.event.pull_request.head.sha || inputs.sha }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          [ -z "$COMMENT" ] || read -r _ SHA _ <<< "$COMMENT"
          pr=$(gh pr view "$PR" --json headRefOid,title)
          head=$(jq -r .headRefOid <<< "$pr")
          # Only the commit you reviewed: if the author pushed since, the head no longer matches.
          # The full id: a short prefix can be matched by another commit made to share it.
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ || "$head" != "$SHA" ]]; then
            msg="Not deploying \`${SHA:-no commit}\`: give the full id of the commit you reviewed. This PR's head is now $head."
            [ -z "$COMMENT" ] || gh pr comment "$PR" --body "$msg"
            echo "::error::$msg"
            exit 1
          fi
          gh api "repos/$GH_REPO/statuses/$head" -f state=pending -f context=preview -f description=Deploying -f target_url="$RUN_URL" > /dev/null
          # A newline in the title would start a new output line, so it could set sha= itself.
          { echo "pr=$PR"; echo "sha=$head"; echo "title=$(jq -r '.title | gsub("[\r\n]"; " ")' <<< "$pr")"; } >> "$GITHUB_OUTPUT"

  deploy:
    needs: target
    runs-on: ubuntu-latest
    concurrency:
      group: preview-${{ needs.target.outputs.pr }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW: pr-${{ needs.target.outputs.pr }}
    defaults:
      run:
        working-directory: worker
    outputs:
      url: ${{ steps.preview.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          # PR code runs with the Cloudflare token; don't hand it a GitHub one in .git/config too.
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: worker/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.13.1
          # No cache: this job runs PR code, and a cache it saves would be restored by main's workflows.
      - run: pnpm install --frozen-lockfile
      # Every preview shares the shelf-preview database, so this PR's migrations land there for all previews.
      - run: pnpm exec wrangler d1 migrations apply DB --remote --config wrangler.preview-migrations.jsonc
      - id: preview
        # The custom build's log goes to stdout ahead of the JSON, so skip to the first line that opens it.
        run: |
          pnpm exec wrangler preview --name "$PREVIEW" --message "$TITLE" --json > preview.json
          url=$(sed -n '/^{/,$p' preview.json | jq -er '.preview.urls[0]')
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          TITLE: ${{ needs.target.outputs.title }}

  # A separate job: PR code ran with sudo on the deploy runner, so that runner never gets a write token.
  report:
    needs: [target, deploy]
    if: always() && needs.target.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.deploy.result }}
          PR: ${{ needs.target.outputs.pr }}
          SHA: ${{ needs.target.outputs.sha }}
          URL: ${{ needs.deploy.outputs.url }}
        # A cancelled deploy was superseded by a newer one, which reports instead.
        run: |
          if [ "$RESULT" = success ]; then
            gh api "repos/$GH_REPO/statuses/$SHA" -f state=success -f context=preview -f description=Deployed -f target_url="$URL" > /dev/null
            gh pr comment "$PR" --edit-last --create-if-none --body "Preview $URL (dashboard at $URL/dashboard)"
          elif [ "$RESULT" = failure ]; then
            gh api "repos/$GH_REPO/statuses/$SHA" -f state=failure -f context=preview -f description="Deploy failed" -f target_url="$RUN_URL" > /dev/null
          fi

  cleanup:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PR: ${{ github.event.pull_request.number }}
      PREVIEW: pr-${{ github.event.pull_request.number }}
    defaults:
      run:
        working-directory: worker
    steps:
      # The base branch, not the PR: this job has secrets for every PR, forks included.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: worker/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.13.1
          # No cache: one a PR's deploy run planted would run here with the Cloudflare token.
      # Only PRs that got a preview have the bot's comment; skip the rest.
      - run: |
          n=$(gh pr view "$PR" --json comments --jq '[.comments[] | select((.author.login | startswith("github-actions")) and (.body | startswith("Preview ")))] | length')
          [ "$n" -gt 0 ] || { echo "PR #$PR has no preview"; exit 0; }
          pnpm install --frozen-lockfile
          pnpm exec wrangler preview delete --name "$PREVIEW" --skip-confirmation
        env:
          GH_TOKEN: ${{ github.token }}
