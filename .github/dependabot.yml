# Keeps the SHA-pinned actions, digest-pinned base images and the Worker's npm packages current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /worker
    schedule:
      interval: weekly
  # One grouped PR a week for the Worker's packages instead of one per package.
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    groups:
      worker:
        patterns: ["*"]
