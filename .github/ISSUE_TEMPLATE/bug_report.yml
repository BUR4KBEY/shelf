name: Bug report
description: Something in shelf doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For a security problem, don't file an issue. See [SECURITY.md](https://github.com/BUR4KBEY/shelf/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `shelf push plan.md`
        2. Open the link
        3. ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, video or logs
      description: Drag files here. Remove keys, passwords and private URLs first.
  - type: dropdown
    id: where
    attributes:
      label: Where does shelf run?
      options:
        - Cloudflare
        - Docker
        - The live demo
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      multiple: true
      options:
        - Dashboard
        - Reading a shared link
        - CLI
        - MCP server
        - llms.txt or HTTP API
        - Agent skills
        - Deploying or setup
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit under Settings → About in the dashboard, and `shelf version` for the CLI.
