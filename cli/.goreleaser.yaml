version: 2

project_name: shelf

builds:
  - binary: shelf
    main: ./cmd/shelf
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# A tag like v1.3.0-rc.1 is published as a pre-release. Only the highest stable tag becomes the latest release:
# release.yml sets MAKE_LATEST, so a patch to an older line doesn't take over the repo's "Latest" badge.
release:
  prerelease: auto
  make_latest: '{{ envOrDefault "MAKE_LATEST" "true" }}'
