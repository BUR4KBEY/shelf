version: 2

project_name: shelf

builds:
  - binary: shelf
    main: ./cmd/shelf
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64, arm]
    # 32-bit ARM (Raspberry Pi and similar) only matters on Linux.
    goarm: ["7"]
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# A tag like v1.3.0-rc.1 is published as a pre-release. Only the highest stable tag becomes the latest release:
# release.yml sets MAKE_LATEST, so a patch to an older line doesn't take over the repo's "Latest" badge.
release:
  prerelease: auto
  make_latest: '{{ envOrDefault "MAKE_LATEST" "true" }}'

# shelf-bin on the AUR is a different tool (iamd3vil/shelf), so this one is shelf-cli-bin.
# Publishing needs the AUR_KEY secret: the private SSH key of the AUR account that owns the package.
# Only the latest release publishes, so a pre-release or a patch to an older line doesn't replace it.
aurs:
  - name: shelf-cli-bin
    homepage: https://github.com/BUR4KBEY/shelf
    description: CLI for shelf, publish HTML pages and docs and get a link back
    license: MIT
    maintainers: ["BUR4KBEY <rectfc@gmail.com>"]
    # Both install /usr/bin/shelf too.
    conflicts: [shelf-bin, shelf-git]
    private_key: '{{ envOrDefault "AUR_KEY" "" }}'
    git_url: ssh://aur@aur.archlinux.org/shelf-cli-bin.git
    skip_upload: '{{ if or (eq (envOrDefault "AUR_KEY" "") "") (eq (envOrDefault "MAKE_LATEST" "true") "false") }}true{{ else }}false{{ end }}'
    commit_author:
      name: BUR4KBEY
      email: rectfc@gmail.com

# Prebuilt binaries for the flake: each release commits nix/package.nix to main with the new URLs and hashes.
nix:
  - name: shelf
    path: nix/package.nix
    homepage: https://github.com/BUR4KBEY/shelf
    description: CLI for shelf, publish HTML pages and docs and get a link back
    license: mit
    main_program: shelf
    formatter: nixfmt
    commit_msg_template: "chore(nix): update shelf to {{ .Tag }}"
    repository:
      owner: BUR4KBEY
      name: shelf
      branch: main
    commit_author:
      name: BUR4KBEY
      email: rectfc@gmail.com
